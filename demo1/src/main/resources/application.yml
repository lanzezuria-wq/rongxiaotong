server:
  port: 8080

spring:
  application:
    name: rxt-backend

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/rxt_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: huangguojun

  jackson:
    # ⚠️ Spring Boot 4 的 Web 层用的是 Jackson 3（tools.jackson 包），
    #    这里的 spring.jackson.* 配置仍然有效，但要注意：
    #    date-format 只影响 java.util.Date，对 LocalDateTime 不生效。
    #    项目里的做法是干脆不在响应体里暴露 LocalDateTime——VO 的日期字段用 String
    #    并在转换时格式化（见 UserVO.from），这样输出格式 100% 可控，
    #    也不会因为 Jackson 主版本升级而改变。
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  # Mapper XML 的位置（注解方式写 SQL 时可以为空，但留着方便后续加复杂查询）
  mapper-locations: classpath*:mapper/**/*.xml
  # 实体类别名包，XML 里就可以直接写 User 而不用写全限定名
  type-aliases-package: com.rxt.entity
  configuration:
    # 数据库的 snake_case 字段自动映射到 Java 的 camelCase 属性（create_time -> createTime）
    map-underscore-to-camel-case: true
    # 开发期把执行的 SQL 打到控制台，方便排查。上线要注释掉
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      # 主键策略：跟随数据库自增
      id-type: auto
      # 全局逻辑删除配置：实体类里加 @TableLogic 或字段名为 deleted 即自动生效
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

rxt:
  jwt:
    # HS256 要求密钥至少 256 bit（32 字节），这串够长。
    # 生产环境要换成环境变量注入，不要提交到 git
    secret: rxt-secret-key-please-change-in-production-0123456789abcdef
    # JWT 有效期（小时）——需求规定 24 小时
    expire-hours: 24
    header: Authorization
    prefix: "Bearer "
  security:
    # 连续登录失败次数上限，超过则锁定
    max-fail-count: 5
    # 锁定时长（分钟）——需求规定 30 分钟
    lock-minutes: 30
    # IP 级限流：防"换手机号批量撞库"（账号级锁定挡不住这种打法）
    rate-limit:
      # 时间窗内允许的登录/注册请求数
      max-requests: 20
      # 时间窗长度（秒）
      window-seconds: 300
  mock:
    # Mock 验证码固定值（需求规定）
    verify-code: "111111"

logging:
  level:
    com.rxt: debug
